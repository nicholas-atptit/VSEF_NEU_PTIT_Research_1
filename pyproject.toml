[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algo-trading-infra"
version = "0.1.0"
description = "Phase 1 & 2 - Data Infrastructure + Quantitative ML Pipeline for Algorithmic Trading"
license = { text = "Proprietary" }
requires-python = ">=3.11"
dependencies = [
    # DNSE SDK
    "dnse>=0.1.0",
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    # Vector DB
    "chromadb>=0.4",
    "sentence-transformers>=2.2",
    # Scheduling
    "apscheduler>=3.10",
    # Data Processing
    "pandas>=2.1",
    "pandas-ta>=0.3.14b0",
    "numpy>=1.26",
    # Statistical forecasting & volatility modeling (Phase 2)
    "statsmodels>=0.14",
    "arch>=8.0",
    # HTTP & Async
    "httpx>=0.27",
    "aiohttp>=3.9",
    # Fast In-Memory Broker & Serialization (Phase 1 Upgrades)
    "redis>=5.0",
    "msgpack>=1.0",
    # Configuration
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    # Logging
    "structlog>=24.1",
    # Web Crawling (Module 4)
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    # Canonical VN market data provider
    "vnstock_data",
    # ML Pipeline (Phase 2)
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.2",
    "catboost>=1.2",
    "joblib>=1.3",
    "torch>=2.5",
    # API (Phase 2)
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    # LLM Integration (Phase 3)
    "openai>=1.12",
    "langchain-text-splitters>=0.2",
    "rich>=13.7.0",
]

[project.optional-dependencies]
ml-rl = [
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-cov>=4.1",
    "ruff>=0.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "research: long-running or artifact-backed research benchmark gates",
]

[tool.ruff]
target-version = "py311"
line-length = 120
